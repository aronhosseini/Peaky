name: Build & Release Peaky

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  VERSION: 1.0.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain (diagnostics)
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -property displayName,installationVersion
      - name: Configure
        # No -G: CMake picks the newest Visual Studio installed on the runner (works for VS 2022 and newer).
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target Peaky_VST3 --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\Peaky.iss `
            /DAppVersion=$env:VERSION `
            "/DVstSource=$env:GITHUB_WORKSPACE\build\Peaky_artefacts\Release\VST3\Peaky.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: Peaky-Windows-Installer
          path: installer/windows/Output/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: |
          cmake --build build --config Release --target Peaky_VST3 --parallel
          cmake --build build --config Release --target Peaky_AU --parallel
      - name: Build .pkg
        env:   # all optional - without them the plugins are ad-hoc signed
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
          DEV_ID_INSTALLER: ${{ secrets.DEV_ID_INSTALLER }}
        run: bash installer/mac/build_pkg.sh "$VERSION" build
      - name: Print sha256 for the Homebrew cask
        run: echo "plugins zip sha256 $(shasum -a 256 installer/mac/out/Peaky-macOS-plugins.zip | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Peaky-macOS-Installer
          path: |
            installer/mac/out/*.pkg
            installer/mac/out/Peaky-macOS-plugins.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
